name: grid
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  dio: ^5.7.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  flutter_secure_storage: ^9.2.4
  go_router: ^17.3.0
  intl: ^0.20.3
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/services/
    - assets/images/billers/

  # Public Sans is bundled rather than fetched at runtime: it is a
  # civic-infrastructure typeface for a civic-infrastructure app, and the
  # signature moments (power meter, ECG token) must never fall back to a
  # substitute face on a poor connection.
  fonts:
    # Shared with GRID Pro. Variable, weights 200–800; includes the cedi sign.
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Variable.ttf
