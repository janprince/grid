name: grid
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  dio: ^5.7.0
  flutter:
    sdk: flutter
  flutter_native_contact_picker: ^0.0.13
  flutter_riverpod: ^3.3.2
  flutter_secure_storage: ^9.2.4
  go_router: ^17.3.0
  intl: ^0.20.3
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/services/
    - assets/images/services/icons/
    - assets/images/services/3d/
    - assets/images/billers/

  # Public Sans is bundled rather than fetched at runtime: it is a
  # civic-infrastructure typeface for a civic-infrastructure app, and the
  # signature moments (power meter, ECG token) must never fall back to a
  # substitute face on a poor connection.
  fonts:
    # Shared with GRID Pro. Variable, weights 200–800; includes the cedi sign.
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Variable.ttf

# App icons: drawn by DOCUMENTATION/app-icons/make_app_icons.py, then
# `dart run flutter_launcher_icons` writes the Android and iOS sets.
flutter_launcher_icons:
  image_path: assets/icon/app_icon.png
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#13294B"
  adaptive_icon_foreground: assets/icon/foreground.png
  adaptive_icon_monochrome: assets/icon/monochrome.png
  # The PNGs already sit inside the safe zone; no extra inset.
  adaptive_icon_foreground_inset: 0
  min_sdk_android: 21
